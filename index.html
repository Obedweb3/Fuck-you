<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Downloader</title>
  <!-- Styles remain unchanged -->
</head>
<body>
  <h1>TikTok Downloader</h1>
  <div class="container">
    <input type="text" id="tiktokUrl" placeholder="Paste TikTok video URL here..." />
    <button onclick="downloadTikTok()">Download</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    async function downloadTikTok() {
      const url = document.getElementById('tiktokUrl').value;
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Fetching download link...';

      try {
        const response = await fetch('https://tikmate.app/api/lookup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ url }),
        });

        const data = await response.json();

        if (data && data.video) {
          resultDiv.innerHTML = `<a href="${data.video}" target="_blank" download="tiktok_video.mp4">Click here to download video</a>`;
        } else {
          resultDiv.innerHTML = 'Failed to retrieve video. Please check the URL.';
        }
      } catch (error) {
        resultDiv.innerHTML = 'Error occurred while fetching video.';
        console.error(error);
      }
    }
  </script>
</body>
</html>
