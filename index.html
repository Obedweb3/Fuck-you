<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Downloader</title>
  <style>
    body {
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    button {
      background-color: #ff0050;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #e60045;
    }

    .result {
      margin-top: 20px;
    }

    .result a {
      color: #00ffcc;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>TikTok Downloader</h1>
  <div class="container">
    <input type="text" id="tiktokUrl" placeholder="Paste TikTok video URL here..." />
    <button onclick="downloadTikTok()">Download</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    async function downloadTikTok() {
      const url = document.getElementById('tiktokUrl').value;
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Fetching download link...';

      try {
        const response = await fetch(`https://existence-apis.vercel.app/api/tiktok/download?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data && data.video) {
          resultDiv.innerHTML = `<a href="${data.video}" target="_blank">Click here to download video</a>`;
        } else {
          resultDiv.innerHTML = 'Failed to retrieve video. Please check the URL.';
        }
      } catch (error) {
        resultDiv.innerHTML = 'Error occurred while fetching video.';
        console.error(error);
      }
    }
  </script>
</body>
</html>
